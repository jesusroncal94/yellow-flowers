<title>Flores Amarillas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Karla:wght@400;500;600&display=swap">
<style>
  :root{
    --night:#0d0b1f;
    --dusk:#221a45;
    --gold:#ffd23f;
    --amber:#ffb703;
    --cream:#fbf5e6;
    --cream-dim:rgba(251,245,230,.66);
    --card:rgba(13,11,31,.64);
    --line:rgba(255,210,63,.26);
    --display:'Fraunces',Georgia,'Times New Roman',serif;
    --body:'Karla','Helvetica Neue',Arial,sans-serif;
    color-scheme:dark;
  }
  html,body{height:100%;}
  body{margin:0;position:relative;background:var(--night);color:var(--cream);font-family:var(--body);overflow:hidden;
       -webkit-font-smoothing:antialiased;}
  #stage{position:absolute;inset:0;}
  #c{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;}

  .eyebrow{position:absolute;top:22px;left:24px;pointer-events:none;display:flex;flex-direction:column;gap:6px;}
  .eyebrow .date{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;}
  .eyebrow .name{font-family:var(--display);font-style:italic;font-weight:300;font-size:1.55rem;line-height:1;color:var(--cream);
                 font-variation-settings:'opsz' 72;}

  .tools{position:absolute;top:18px;right:20px;display:flex;gap:8px;}
  .tools button{background:rgba(13,11,31,.55);border:1px solid var(--line);color:var(--cream-dim);border-radius:999px;
                padding:7px 13px;font:500 .74rem/1 var(--body);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
                backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  .tools button:hover,.tools button:focus-visible{border-color:var(--gold);color:var(--gold);outline:none;}
  .tools button[aria-pressed="false"]{text-decoration:line-through;opacity:.7;}

  .card{position:absolute;left:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:min(460px,calc(100% - 48px));
        background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 26px 20px;box-sizing:border-box;
        backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 30px 60px -30px rgba(0,0,0,.8);}
  .msg{transition:opacity .38s ease,transform .38s ease;}
  .card.out .msg{opacity:0;transform:translateY(10px);}
  .kicker{margin:0 0 10px;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;}
  .line{margin:0;font-family:var(--display);font-style:italic;font-weight:300;font-size:clamp(1.22rem,2.3vw,1.62rem);
        line-height:1.34;color:var(--cream);text-wrap:pretty;font-variation-settings:'opsz' 36;}
  .line em{font-style:normal;color:var(--gold);}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:20px;}
  .dots{display:flex;gap:9px;}
  .dots i{display:block;width:9px;height:9px;border:1px solid var(--gold);border-radius:60% 0;transform:rotate(-45deg);
          opacity:.45;transition:opacity .3s,background .3s;}
  .dots i.on{background:var(--gold);opacity:1;}
  #next{background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:9px 18px;
        font:600 .74rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s;}
  #next:hover,#next:focus-visible{background:var(--gold);color:var(--night);outline:none;}

  .hint{position:absolute;right:24px;bottom:calc(26px + env(safe-area-inset-bottom,0px));pointer-events:none;
        font-size:.74rem;letter-spacing:.06em;color:var(--cream-dim);transition:opacity 1.2s;max-width:180px;text-align:right;line-height:1.4;}
  .hint.gone{opacity:0;}

  .photo{position:absolute;right:28px;bottom:calc(28px + env(safe-area-inset-bottom,0px));margin:0;width:200px;padding:10px 10px 12px;
         background:#fbf5e6;box-shadow:0 24px 50px -18px rgba(0,0,0,.9);transform:rotate(-4deg) scale(.92);opacity:0;
         pointer-events:none;transition:opacity .9s ease,transform .9s cubic-bezier(.2,.9,.3,1.2);}
  .photo.show{opacity:1;transform:rotate(-4deg) scale(1);pointer-events:auto;}
  .photo img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;}
  .photo figcaption{margin-top:9px;font-family:var(--display);font-style:italic;font-size:.9rem;color:#3a2a10;text-align:center;letter-spacing:.02em;}

  @media (max-width:640px){
    .eyebrow{top:16px;left:16px;}
    .eyebrow .name{font-size:1.3rem;}
    .tools{top:14px;right:14px;}
    .card{left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);padding:18px 20px 16px;}
    .hint{display:none;}
    .photo{right:14px;top:62px;bottom:auto;width:112px;padding:6px 6px 8px;}
    .photo figcaption{font-size:.7rem;margin-top:6px;}
  }
  @media (prefers-reduced-motion:reduce){
    .msg,.dots i,#next{transition:none;}
  }
</style>

<div id="stage">
  <canvas id="c" aria-label="Jardín de flores amarillas en 3D"></canvas>

  <div class="eyebrow">
    <span class="date">21 de septiembre · Milán</span>
    <span class="name">Flores amarillas para Yomara</span>
  </div>

  <div class="tools">
    <button id="sound" type="button" aria-pressed="true">♪ Sonido</button>
  </div>

  <section class="card" id="card" aria-live="polite">
    <div class="msg">
      <p class="kicker" id="kicker">21 de septiembre</p>
      <p class="line" id="line">En Milán hoy no empieza la primavera, y hace dos días cumplimos dos años. No necesito una estación para regalarte flores amarillas, Yomara: me basta con que seas tú.</p>
    </div>
    <div class="nav">
      <div class="dots" id="dots" aria-hidden="true"></div>
      <button id="next" type="button">Siguiente</button>
    </div>
  </section>

  <p class="hint" id="hint">Toca el jardín para sembrar una flor</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(function () {
  // ─── Personaliza aquí ───────────────────────────────────────────────
  const NOMBRE = 'Yomara';
  const APODO = 'mi pollo hermoso';
  const MENSAJES = [
    { k: '21 de septiembre',   t: 'En Milán hoy no empieza la primavera, y hace dos días cumplimos dos años. No necesito una estación para regalarte flores amarillas, ' + NOMBRE + ': me basta con que seas tú.' },
    { k: 'Flores amarillas',   t: 'Estas son virtuales y no se marchitan. Las de verdad te las seguiré llevando, aquí o donde estemos, porque cada detalle que te doy es mi manera de decirte <em>te amo</em> sin que se me gaste la palabra.' },
    { k: 'Lo que superamos',   t: 'Somos tercos, los dos. Y aun así, ante cada problema, nunca hemos buscado ganar: hemos buscado resolver. Al final siempre gana lo mismo, y no es ninguno de los dos.' },
    { k: 'Lo que construimos', t: 'En abril de 2025 crucé un océano para alcanzarte, y no me arrepiento ni un solo día de haber venido a hacer una vida contigo. No nos conformamos con haber llegado: soñamos en grande, trabajamos por ello, y cada meta cumplida nos deja con ganas de la siguiente.' },
    { k: 'Lo que viene',       t: 'Lo prometo: cada detalle, cada flor, cada día. Porque lo nuestro vuelve a florecer cada vez que decidimos crecer juntos, y el amor siempre es más grande que cualquier terquedad.' },
    { k: 'Para ti',            t: 'Feliz primavera, <em>' + NOMBRE + '</em> (' + APODO + ', mi amor). Vamos por más.', final: true },
  ];
  const FLORES_INICIALES = 150;
  const CAPACIDAD = 320;
  // ────────────────────────────────────────────────────────────────────

  const motion = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.25 : 1;
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

  // ─── Sonido (campanita suave al sembrar) ────────────────────────────
  let actx = null, soundOn = true;
  const NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
  function chime() {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime, f = NOTES[Math.floor(Math.random() * NOTES.length)];
      const g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.11, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
      g.connect(actx.destination);
      [[f, 1, 'sine'], [f * 2, 0.25, 'triangle']].forEach(([fr, vol, type]) => {
        const o = actx.createOscillator(), og = actx.createGain();
        o.type = type; o.frequency.value = fr; og.gain.value = vol;
        o.connect(og).connect(g); o.start(t); o.stop(t + 1.7);
      });
    } catch (e) {}
  }
  const soundBtn = document.getElementById('sound');
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    if (soundOn) chime();
  });

  // ─── Escena ─────────────────────────────────────────────────────────
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d0b1f);
  scene.fog = new THREE.FogExp2(0x231b45, 0.05);

  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 250);
  const camBase = new THREE.Vector3(0, 2.1, 8.6);
  const camLook = new THREE.Vector3(0, 1.25, 0);

  // Cielo: cúpula con degradado del atardecer a la noche
  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(100, 32, 16),
    new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      uniforms: {
        top: { value: new THREE.Color(0x06051a) },
        mid: { value: new THREE.Color(0x1c1640) },
        bot: { value: new THREE.Color(0x2c2152) },
      },
      vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: 'uniform vec3 top, mid, bot; varying vec3 vP; void main(){ float h = normalize(vP).y; vec3 c = h < 0.14 ? mix(bot, mid, smoothstep(-0.05, 0.14, h)) : mix(mid, top, smoothstep(0.14, 0.75, h)); gl_FragColor = vec4(c, 1.0); }',
    })
  );
  scene.add(dome);

  // Estrellas
  {
    const n = 700, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), e = rand(0.08, 1.4), r = 90;
      pos[i * 3] = r * Math.cos(e) * Math.cos(a);
      pos[i * 3 + 1] = r * Math.sin(e);
      pos[i * 3 + 2] = r * Math.cos(e) * Math.sin(a);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xfff6dc, size: 0.55, sizeAttenuation: true, fog: false, transparent: true, opacity: 0.85 })));
  }

  // Suelo
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(80, 64),
    new THREE.MeshStandardMaterial({ color: 0x171a30, roughness: 1, metalness: 0 })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // Luces
  scene.add(new THREE.HemisphereLight(0x7d6cff, 0x1c2a1a, 1.1));
  const moon = new THREE.DirectionalLight(0xdfe6ff, 1.6);
  moon.position.set(-4, 8, -3);
  scene.add(moon);
  const warm = new THREE.DirectionalLight(0xffe2a8, 1.4);
  warm.position.set(4, 5, 6);
  scene.add(warm);
  const lantern = new THREE.PointLight(0xffc14d, 30, 16, 2);
  lantern.position.set(0, 2.6, 2.2);
  scene.add(lantern);

  // ─── Geometrías ─────────────────────────────────────────────────────
  function petalGeometry(curl) {
    const s = new THREE.Shape();
    s.moveTo(0, 0);
    s.bezierCurveTo(0.14, 0.05, 0.17, 0.6, 0, 1);
    s.bezierCurveTo(-0.17, 0.6, -0.14, 0.05, 0, 0);
    const g = new THREE.ShapeGeometry(s, 10);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i);
      p.setZ(i, -curl * y * y + 1.2 * x * x);
    }
    g.computeVertexNormals();
    return g;
  }
  const PET = 10;
  const petalGeo = petalGeometry(0.35);
  petalGeo.scale(0.4, 0.4, 0.4);
  const leafGeo = petalGeometry(0.15);
  leafGeo.scale(0.3, 0.42, 0.3);
  const stemGeo = new THREE.CylinderGeometry(0.02, 0.032, 1, 6);
  stemGeo.translate(0, 0.5, 0);
  const centerGeo = new THREE.SphereGeometry(0.1, 14, 10);

  const petalMat = new THREE.MeshStandardMaterial({ color: 0xffd23f, emissive: 0xff9a00, emissiveIntensity: 0.22, roughness: 0.55, metalness: 0, side: THREE.DoubleSide });
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x3e7a3a, roughness: 0.8, side: THREE.DoubleSide });
  const stemMat = new THREE.MeshStandardMaterial({ color: 0x2f6b34, roughness: 0.85 });
  const centerMat = new THREE.MeshStandardMaterial({ color: 0x5a3610, emissive: 0x2a1400, emissiveIntensity: 0.4, roughness: 0.9 });

  const N = CAPACIDAD;
  const stems = new THREE.InstancedMesh(stemGeo, stemMat, N);
  const leaves = new THREE.InstancedMesh(leafGeo, leafMat, N);
  const centers = new THREE.InstancedMesh(centerGeo, centerMat, N);
  const petals = new THREE.InstancedMesh(petalGeo, petalMat, N * PET);
  [stems, leaves, centers, petals].forEach(m => { m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(m); });

  const zero = new THREE.Matrix4().makeScale(0, 0, 0);
  const tint = new THREE.Color();
  for (let i = 0; i < N; i++) {
    stems.setMatrixAt(i, zero); leaves.setMatrixAt(i, zero); centers.setMatrixAt(i, zero);
    tint.setHSL(rand(0.115, 0.145), rand(0.9, 1), rand(0.56, 0.68));
    for (let k = 0; k < PET; k++) { petals.setMatrixAt(i * PET + k, zero); petals.setColorAt(i * PET + k, tint); }
  }

  // Resplandor por flor (puntos con textura radial)
  function glowTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, 'rgba(255,225,140,1)');
    g.addColorStop(0.35, 'rgba(255,190,70,0.45)');
    g.addColorStop(1, 'rgba(255,170,40,0)');
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
  }
  const glowTex = glowTexture();
  const glowPos = new Float32Array(N * 3);
  const glowAmt = new Float32Array(N);
  const glowGeo = new THREE.BufferGeometry();
  glowGeo.setAttribute('position', new THREE.BufferAttribute(glowPos, 3).setUsage(THREE.DynamicDrawUsage));
  glowGeo.setAttribute('aBloom', new THREE.BufferAttribute(glowAmt, 1).setUsage(THREE.DynamicDrawUsage));
  const glowMat = new THREE.ShaderMaterial({
    uniforms: { uTex: { value: glowTex }, uSize: { value: 1.35 }, uPulse: { value: 1 } },
    vertexShader: 'attribute float aBloom; varying float vB; uniform float uSize; uniform float uPulse; void main(){ vB = aBloom; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = aBloom * uSize * uPulse * (420.0 / -mv.z); gl_Position = projectionMatrix * mv; }',
    fragmentShader: 'uniform sampler2D uTex; varying float vB; void main(){ vec4 t = texture2D(uTex, gl_PointCoord); gl_FragColor = vec4(t.rgb, 1.0) * t.a * 0.5 * vB; }',
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  scene.add(new THREE.Points(glowGeo, glowMat));

  // Polen flotando
  const POLLEN = 420;
  const pollenPos = new Float32Array(POLLEN * 3), pollenSeed = new Float32Array(POLLEN);
  for (let i = 0; i < POLLEN; i++) {
    pollenPos[i * 3] = rand(-9, 9); pollenPos[i * 3 + 1] = rand(0.2, 5); pollenPos[i * 3 + 2] = rand(-8, 5);
    pollenSeed[i] = rand(0, TAU);
  }
  const pollenGeo = new THREE.BufferGeometry();
  pollenGeo.setAttribute('position', new THREE.BufferAttribute(pollenPos, 3).setUsage(THREE.DynamicDrawUsage));
  scene.add(new THREE.Points(pollenGeo, new THREE.PointsMaterial({ map: glowTex, color: 0xffe08a, size: 0.09, transparent: true, opacity: 0.8, depthWrite: false, blending: THREE.AdditiveBlending })));

  // Lluvia de pétalos (final)
  const RAIN = 160;
  const rain = new THREE.InstancedMesh(petalGeo, petalMat, RAIN);
  rain.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const rainState = [];
  for (let i = 0; i < RAIN; i++) {
    rain.setMatrixAt(i, zero);
    rain.setColorAt(i, tint.setHSL(rand(0.115, 0.145), 1, rand(0.58, 0.7)));
    rainState.push({ x: 0, y: -1, z: 0, vx: 0, rx: rand(0, TAU), ry: rand(0, TAU), rz: rand(0, TAU), wx: rand(-2, 2), wy: rand(-2, 2), wz: rand(-2, 2), seed: rand(0, TAU) });
  }
  scene.add(rain);
  let rainOn = false;
  function respawnPetal(p, top) {
    p.x = rand(-6, 6); p.y = top ? rand(5.5, 9) : rand(-1, 9); p.z = rand(-4, 4); p.vx = rand(-0.3, 0.3);
  }

  // ─── Flores ─────────────────────────────────────────────────────────
  const flowers = [];
  for (let i = 0; i < N; i++) flowers.push({ alive: false, tapped: false, x: 0, z: 0, h: 1, phase: 0, leanX: 0, leanZ: 0, spin: 0, leafA: 0, stage: 0, bloom: 0, target: 0, delay: 0, timer: 0 });
  let cursor = 0;
  let step = 0;
  function stageFor() {
    const r = Math.random();
    return r < 0.10 ? 0 : r < 0.22 ? 1 : r < 0.36 ? 2 : r < 0.52 ? 3 : r < 0.70 ? 4 : 5;
  }
  function plant(x, z, tapped) {
    let idx = flowers.findIndex(f => !f.alive);
    if (idx < 0) { idx = cursor; cursor = (cursor + 1) % N; }
    const f = flowers[idx];
    f.alive = true; f.tapped = tapped;
    f.x = x; f.z = z; f.h = rand(0.7, 1.55);
    f.phase = rand(0, TAU); f.leanX = rand(-0.12, 0.12); f.leanZ = rand(-0.12, 0.12);
    f.spin = rand(0, TAU); f.leafA = rand(0, TAU);
    f.stage = tapped ? 0 : stageFor();
    f.bloom = 0; f.timer = 0;
    f.target = tapped || f.stage <= step ? 1 : 0;
    f.delay = tapped ? 0.05 : rand(0, 1.4);
    return f;
  }

  const dummy = new THREE.Object3D();
  const qStem = new THREE.Quaternion(), qHead = new THREE.Quaternion(), qTmp = new THREE.Quaternion(), qPet = new THREE.Quaternion();
  const vHead = new THREE.Vector3(), vLeaf = new THREE.Vector3(), vBase = new THREE.Vector3();
  const AX = new THREE.Vector3(1, 0, 0), AY = new THREE.Vector3(0, 1, 0);

  function updateFlowers(t, dt) {
    for (let i = 0; i < N; i++) {
      const f = flowers[i];
      if (!f.alive) continue;
      if (f.target > f.bloom) { if (f.timer < f.delay) f.timer += dt; else f.bloom = Math.min(1, f.bloom + dt / 1.7); }
      else if (f.target < f.bloom) f.bloom = Math.max(0, f.bloom - dt / 1.1);

      const sway = (Math.sin(t * 1.1 + f.phase) * 0.05 + Math.sin(t * 0.37 + f.phase * 2) * 0.035) * motion;
      vBase.set(f.x, 0, f.z);
      dummy.position.copy(vBase);
      dummy.rotation.set(f.leanX + sway, 0, f.leanZ + Math.cos(t * 0.9 + f.phase) * 0.04 * motion);
      dummy.scale.set(1, f.h, 1);
      dummy.updateMatrix();
      stems.setMatrixAt(i, dummy.matrix);
      qStem.setFromEuler(dummy.rotation);

      // hoja a media altura
      vLeaf.set(0, f.h * 0.42, 0).applyQuaternion(qStem).add(vBase);
      qTmp.setFromAxisAngle(AY, f.leafA); qPet.copy(qStem).multiply(qTmp);
      qTmp.setFromAxisAngle(AX, 1.05); qPet.multiply(qTmp);
      dummy.position.copy(vLeaf); dummy.quaternion.copy(qPet); dummy.scale.set(1, 1, 1); dummy.updateMatrix();
      leaves.setMatrixAt(i, dummy.matrix);

      // cabeza: se inclina un poco hacia quien mira
      vHead.set(0, f.h, 0).applyQuaternion(qStem).add(vBase);
      qTmp.setFromAxisAngle(AX, 0.6); qHead.copy(qStem).multiply(qTmp);
      const b = easeOutBack(f.bloom);
      const bc = clamp01(b);
      const cs = 0.5 + 0.5 * bc;
      dummy.position.copy(vHead); dummy.quaternion.copy(qHead); dummy.scale.set(cs, cs * 0.55, cs); dummy.updateMatrix();
      centers.setMatrixAt(i, dummy.matrix);

      const tilt = 0.12 + 1.12 * Math.min(1.08, Math.max(0, b));
      const ps = 0.45 + 0.55 * Math.max(0, b);
      for (let k = 0; k < PET; k++) {
        qTmp.setFromAxisAngle(AY, k * TAU / PET + f.spin); qPet.copy(qHead).multiply(qTmp);
        qTmp.setFromAxisAngle(AX, tilt); qPet.multiply(qTmp);
        dummy.quaternion.copy(qPet); dummy.scale.set(ps, ps, ps); dummy.updateMatrix();
        petals.setMatrixAt(i * PET + k, dummy.matrix);
      }
      glowPos[i * 3] = vHead.x; glowPos[i * 3 + 1] = vHead.y; glowPos[i * 3 + 2] = vHead.z;
      glowAmt[i] = bc;
    }
    stems.instanceMatrix.needsUpdate = true;
    leaves.instanceMatrix.needsUpdate = true;
    centers.instanceMatrix.needsUpdate = true;
    petals.instanceMatrix.needsUpdate = true;
    glowGeo.attributes.position.needsUpdate = true;
    glowGeo.attributes.aBloom.needsUpdate = true;
  }

  function updatePollen(t, dt) {
    for (let i = 0; i < POLLEN; i++) {
      const s = pollenSeed[i];
      pollenPos[i * 3] += Math.sin(t * 0.5 + s) * 0.12 * dt * motion;
      pollenPos[i * 3 + 1] += (0.08 + 0.05 * Math.sin(s)) * dt * motion;
      pollenPos[i * 3 + 2] += Math.cos(t * 0.4 + s * 1.3) * 0.1 * dt * motion;
      if (pollenPos[i * 3 + 1] > 5.5) pollenPos[i * 3 + 1] = 0.1;
    }
    pollenGeo.attributes.position.needsUpdate = true;
  }

  function updateRain(t, dt) {
    for (let i = 0; i < RAIN; i++) {
      const p = rainState[i];
      if (p.y < -0.5) {
        if (!rainOn) { rain.setMatrixAt(i, zero); continue; }
        respawnPetal(p, true);
      }
      p.y -= (0.55 + 0.25 * Math.sin(p.seed)) * dt;
      p.x += (p.vx + Math.sin(t * 1.3 + p.seed) * 0.5) * dt;
      p.z += Math.cos(t * 0.9 + p.seed) * 0.3 * dt;
      p.rx += p.wx * dt; p.ry += p.wy * dt; p.rz += p.wz * dt;
      dummy.position.set(p.x, p.y, p.z); dummy.rotation.set(p.rx, p.ry, p.rz); dummy.scale.set(0.8, 0.8, 0.8); dummy.updateMatrix();
      rain.setMatrixAt(i, dummy.matrix);
    }
    rain.instanceMatrix.needsUpdate = true;
  }
  function startRain() { if (rainOn) return; rainOn = true; rainState.forEach(p => respawnPetal(p, false)); }
  function stopRain() { rainOn = false; }

  // ─── Mensaje por pasos ──────────────────────────────────────────────
  const card = document.getElementById('card');
  const kicker = document.getElementById('kicker');
  const line = document.getElementById('line');
  const next = document.getElementById('next');
  const dots = document.getElementById('dots');
  const photo = document.getElementById('photo');
  MENSAJES.forEach(() => dots.appendChild(document.createElement('i')));

  function applyStep(instant) {
    for (const f of flowers) {
      if (!f.alive || f.tapped) continue;
      f.target = f.stage <= step ? 1 : 0;
      f.timer = 0;
      f.delay = f.stage === step ? rand(0, 1.6) : 0;
      if (instant && f.target === 1) f.bloom = 1;
    }
    if (MENSAJES[step].final) startRain(); else stopRain();
    photo.classList.toggle('show', !!MENSAJES[step].final);
    if (MENSAJES[step].final) hint.classList.add('gone');
  }
  function renderCard(animate) {
    const m = MENSAJES[step];
    const swap = () => {
      kicker.textContent = m.k;
      line.innerHTML = m.t;
      next.textContent = m.final ? 'Volver a leer' : 'Siguiente';
      [...dots.children].forEach((d, i) => d.classList.toggle('on', i <= step));
      card.classList.remove('out');
    };
    if (animate) { card.classList.add('out'); setTimeout(swap, 380); } else swap();
  }
  next.addEventListener('click', () => {
    step = MENSAJES[step].final ? 0 : step + 1;
    applyStep(false);
    renderCard(true);
    chime();
    try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ step })); } catch (e) {}
  });

  // ─── Interacción con el jardín ──────────────────────────────────────
  const hint = document.getElementById('hint');
  let hinted = false;
  const ray = new THREE.Raycaster();
  const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const ndc = new THREE.Vector2(), hit = new THREE.Vector3();
  canvas.addEventListener('pointerdown', e => {
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(groundPlane, hit) && Math.abs(hit.x) < 14 && hit.z > -14 && hit.z < 6.5) {
      plant(hit.x, hit.z, true);
      chime();
      if (!hinted) { hinted = true; hint.classList.add('gone'); }
    }
  });
  let px = 0, py = 0, sx = 0, sy = 0;
  window.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    px = (e.clientX / window.innerWidth) * 2 - 1;
    py = (e.clientY / window.innerHeight) * 2 - 1;
  });
  setTimeout(() => { if (!hinted) hint.classList.add('gone'); }, 9000);

  // ─── Arranque ───────────────────────────────────────────────────────
  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w < h ? 52 : 40;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  function start(data) {
    step = data && Number.isInteger(data.step) ? Math.min(Math.max(0, data.step), MENSAJES.length - 1) : 0;
    for (let i = 0; i < FLORES_INICIALES; i++) {
      // más densas en el centro, ninguna pegada a la cámara
      const a = rand(0, TAU), rr = 0.8 + 7.2 * Math.sqrt(Math.random());
      const x = Math.cos(a) * rr * 1.25, z = -1.2 + Math.sin(a) * rr * 0.8;
      plant(x, Math.min(z, 3.6), false);
    }
    applyStep(true);
    renderCard(false);
    resize();
    const clock = new THREE.Clock();
    let t = 0;
    function frame() {
      const dt = Math.min(clock.getDelta(), 0.05);
      t += dt;
      sx += (px - sx) * 0.04; sy += (py - sy) * 0.04;
      const drift = Math.sin(t * 0.08) * 1.1 * motion;
      camera.position.set(camBase.x + drift + sx * 0.9, camBase.y - sy * 0.35 + Math.sin(t * 0.13) * 0.08 * motion, camBase.z);
      camera.lookAt(camLook.x + sx * 0.3, camLook.y - sy * 0.15, camLook.z);
      lantern.intensity = 30 + Math.sin(t * 1.7) * 3 * motion;
      glowMat.uniforms.uPulse.value = 1 + Math.sin(t * 1.4) * 0.08 * motion;
      updateFlowers(t, dt);
      updatePollen(t, dt);
      updateRain(t, dt);
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    frame();
  }
  if (window.claude && window.claude.hot && typeof window.claude.hot.ready === 'function') window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
